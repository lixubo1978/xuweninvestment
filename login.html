
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>序文投资｜登录</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;display:grid;place-items:center;
 background:#f1f5f2;color:#193b2c;
 font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif;
}
.panel{
 width:min(430px,calc(100% - 32px));
 background:white;border-radius:18px;padding:40px;
 box-shadow:0 15px 50px #123b2415;
}
.brand{color:#176448;font-size:13px;font-weight:700;letter-spacing:3px}
h1{font-size:25px;margin:18px 0 8px}
.sub{color:#84938a;font-size:13px;margin-bottom:30px}
label{display:block;margin:18px 0 8px;font-size:14px}
input{
 width:100%;padding:14px;border:1px solid #d7e2da;
 border-radius:9px;font-size:16px;outline:none;
}
input:focus{border-color:#176448}
button{
 width:100%;margin-top:26px;padding:15px;border:0;
 border-radius:9px;background:#176448;color:white;
 font-size:16px;cursor:pointer;
}
button:disabled{opacity:.6}
#error{color:#bd3434;font-size:13px;min-height:20px;margin-top:16px}
.footer{text-align:center;color:#a2aea6;font-size:12px;margin-top:22px}
</style>
</head>
<body>
<div class="panel">
 <div class="brand">XUWEN INVESTMENT</div>
 <h1>序文投资管理系统</h1>
 <div class="sub">集团与SPV项目资产管理平台</div>

 <form id="form">
  <label for="username">用户名</label>
  <input id="username" autocomplete="username"
         placeholder="请输入用户名" required>

  <label for="password">密码</label>
  <input id="password" type="password"
         autocomplete="current-password"
         placeholder="请输入密码" required>

  <button id="submit" type="submit">登录管理系统</button>
 </form>
 <div id="error" role="alert"></div>
 <div class="footer">© 序文投资 · 内部管理系统</div>
</div>

<script>
const API = "https://api-xuwen.shuofengtechnology.com";
const form = document.getElementById("form");
const button = document.getElementById("submit");
const errorBox = document.getElementById("error");

form.addEventListener("submit", async event => {
 event.preventDefault();
 button.disabled = true;
 button.textContent = "正在登录...";
 errorBox.textContent = "";

 try {
  const response = await fetch(API + "/api/login", {
   method: "POST",
   credentials: "include",
   headers: {"Content-Type":"application/json"},
   body: JSON.stringify({
    username: document.getElementById("username").value.trim(),
    password: document.getElementById("password").value
   })
  });

  const data = await response.json();

  if (!response.ok || !data.success) {
   throw new Error(data.error || "登录失败");
  }

  if (data.user.must_change_password) {
   location.replace("change-password.html");
  } else {
   location.replace("wholemanagement.html");
  }

 } catch (error) {
  errorBox.textContent = error.message;
 } finally {
  button.disabled = false;
  button.textContent = "登录管理系统";
 }
});
</script>
</body>
</html>
